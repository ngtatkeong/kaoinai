# KaoinAI Marketing Site — Production Nginx Configuration
# Place this file at: /etc/nginx/sites-available/kaoinai
# Then symlink: ln -s /etc/nginx/sites-available/kaoinai /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=kaoinai_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kaoinai.com www.kaoinai.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaoinai.com www.kaoinai.com;

    # === SSL CERTIFICATES (Let's Encrypt) ===
    # Replace these paths with your actual cert paths after running certbot
    ssl_certificate /etc/letsencrypt/live/kaoinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaoinai.com/privkey.pem;

    # === SSL HARDENING ===
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/kaoinai.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # === ROOT & INDEX ===
    root /opt/kaionai-site;
    index index.html;

    # === SECURITY HEADERS ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === GZIP COMPRESSION ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # === BROWSER CACHING ===
    # Images, fonts, videos — cache for 1 year
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS, JS — cache for 1 month
    location ~* \.(?:css|js)$ {
        expires 1M;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # HTML — no cache (always fresh)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # === ROBOTS, SITEMAP & LLMS.TXT ===
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /llms.txt {
        allow all;
        default_type text/plain;
        log_not_found off;
        access_log off;
    }

    # === RATE LIMITING ===
    location / {
        limit_req zone=kaoinai_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # === BLOCK HIDDEN FILES ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # === BLOCK BACKUP/SOURCE FILES ===
    location ~* \.(?:bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
