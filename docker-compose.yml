version: "3.8"

services:
  kaoinai:
    image: nginx:alpine
    container_name: kaoinai
    restart: unless-stopped
    volumes:
      - /opt/kaionai-site:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kaoinai.rule=Host(`kaoinai.com`) || Host(`www.kaoinai.com`)"
      - "traefik.http.routers.kaoinai.entrypoints=websecure"
      - "traefik.http.routers.kaoinai.tls.certresolver=letsencrypt"
      - "traefik.http.services.kaoinai.loadbalancer.server.port=80"
    networks:
      - deploy_default

networks:
  deploy_default:
    external: true
